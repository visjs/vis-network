        type="hidden"

        value='{"css":"#mynetwork {\n  width: 1000px;\n  height: 400px;\n  border: 1px solid lightgray;\n}\n\ntd {\n  vertical-align: top;\n}\ntable {\n  width: 800px;\n}\n","css_external":"","html":"<h1>Hierarchical Layout without Physics</h1>\nThe hierarchical layout can now be controlled without the use of physics. This is much quicker. The\noptions for this are: <br /><br />\n\n<table>\n  <tbody>\n    <tr>\n      <td width=\"150px\"><code>levelSeparation</code></td>\n      <td width=\"400px\">Distance between levels.</td>\n    </tr>\n    <tr>\n      <td><code>nodeSpacing</code></td>\n      <td>Minimum distance between nodes on the free axis.</td>\n    </tr>\n    <tr>\n      <td><code>treeSpacing</code></td>\n      <td>Distance between different trees (independent networks).</td>\n    </tr>\n    <tr>\n      <td><code>blockShifting</code></td>\n      <td>\n        Method for reducing whitespace. Can be used alone or together with edge minimization. Each\n        node will check for whitespace and will shift it&apos;s branch along with it for as far as it\n        can, respecting the nodeSpacing on any level.\n      </td>\n    </tr>\n    <tr>\n      <td><code>edgeMinimization</code></td>\n      <td>\n        Method for reducing whitespace. Can be used alone or together with block shifting. Enabling\n        block shifting will usually speed up the layout process. Each node will try to move along\n        its free axis to reduce the total length of it&apos;s edges.\n      </td>\n    </tr>\n    <tr>\n      <td><code>parentCentralization</code></td>\n      <td>\n        When true, the parents nodes will be centered again after the the layout algorithm has been\n        finished.\n      </td>\n    </tr>\n  </tbody>\n</table>\n<br /><br />\nPlay with the settings below the network and see how the layout changes!\n<div id=\"mynetwork\"></div>\n","js":"import { nodes, edges } from \"../datasources/largeHierarchicalDataset.js\";\n\nvar data = {\n  nodes: nodes,\n  edges: edges,\n};\n// create a network\nvar container = document.getElementById(\"mynetwork\");\nvar options = {\n  layout: {\n    hierarchical: {\n      direction: \"UD\",\n      sortMethod: \"directed\",\n    },\n  },\n  interaction: { dragNodes: false },\n  physics: {\n    enabled: false,\n  },\n  configure: {\n    filter: function (option, path) {\n      if (path.indexOf(\"hierarchical\") !== -1) {\n        return true;\n      }\n      return false;\n    },\n    showButton: false,\n  },\n};\nglobalThis.network = new vis.Network(container, data, options);\n","js_external":"https://visjs.github.io/vis-network/standalone/umd/vis-network.min.js","title":"Vis Network | Layouts | Hierarchical Layout without Physics"}'
